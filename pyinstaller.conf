# Snake Game - Rắn Săn Mồi - Build Configuration
# PyInstaller Configuration File

[spec]
name = SnakeGame
version = 1.0.0
author = chanthanhvu2014-cpu

[build]
one_file = true
windowed = true
console = false

[output]
dist_dir = dist
build_dir = build
exe_name = SnakeGame.exe

[files]
main_script = snake_game.py
icon = None
additional_files = []

[dependencies]
pygame = 2.5.2
pyinstaller = 6.3.0